<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="static/css/bootstrap.min.css">
    <link rel="stylesheet" href="static/css/number.css">
    <script src="static/js/bootstrap.bundle.min.js"></script>
    <script src="static/js/bootstrap.min.js"></script>
    <script src="static/js/number.js"></script>
</head>
<body>
    <div class="container">
        <h1 class="game-title">Игра: угадай число</h1>
        
        <div class="fixed-square">
            <p class="range-text">гуга гага</p>
            <p class="range-2-text">У вас есть n попыток его угадать. Удачи!</p>
            
            <input class="number-input" type="number" placeholder="Введите число...">
            
            <div class="button-group">
                <button type="button" class="but btn btn-outline-light">Угадать</button>
                <button type="button" class="but btn btn-outline-light">Начать заново</button>
            </div>
            
            <p class="hint-text">Загадано число "больше/меньше" "63"</p>
            <p class="history-text">История: </p>
        </div>
    </div>
</body>
</html>
